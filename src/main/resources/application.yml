# Spring Boot 애플리케이션의 기본 설정
spring:
  application:
    # 애플리케이션 이름이다. Actuator와 로그 등에서 식별자로 사용된다.
    name: kafka-order-lab
  kafka:
    # Spring Boot가 Kafka에 접속할 시작 주소다.
    # 환경변수가 없으면 호스트에서 실행하는 앱 기준 localhost:29092를 사용한다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # Consumer Group에 저장된 offset이 없을 때 가장 오래된 record부터 읽는다.
      # 이미 저장된 offset이 있으면 그 offset부터 이어서 읽는다.
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  jackson:
    default-property-inclusion: non_null

# 여러 인스턴스를 동시에 실행할 때 포트 충돌을 피하기 위해 환경변수로 덮어쓴다.
server:
  port: ${SERVER_PORT:8080}

# 애플리케이션에서 사용하는 Kafka 이름과 병렬성 설정
app:
  kafka:
    topics:
      # 주문 생명주기 이벤트를 발행하고 소비할 topic이다. partition 3개로 운영한다.
      order-events: order-events
      # 결제 요청 이벤트를 발행하고 소비할 topic이다. partition 3개로 운영한다.
      payment-events: payment-events
    consumer:
      # 주문 이벤트를 관찰하는 Consumer Group이다.
      order-observer:
        group-id: order-observer
        concurrency: ${ORDER_OBSERVER_CONCURRENCY:1}
      # 주문 생성 이벤트를 받아 결제 요청 이벤트를 발행하는 Consumer Group이다.
      # concurrency는 인스턴스 안의 consumer 수이므로 partition 수를 넘으면 idle consumer가 생긴다.
      payment-service:
        group-id: payment-service
        concurrency: ${PAYMENT_SERVICE_CONCURRENCY:1}
      # 결제 요청 이벤트의 metadata를 기록하는 가짜 결제 observer Consumer Group이다.
      payment-observer:
        group-id: payment-observer
        concurrency: ${PAYMENT_OBSERVER_CONCURRENCY:1}
